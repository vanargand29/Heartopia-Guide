<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heartopia Guide • Van Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #8b5cf6;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f1f5f9;
      --text-light: #cbd5e1;
      --text-dim: #94a3b8;
      --border: #334155;
      --border-hover: #475569;
      --shadow: rgba(0,0,0,0.4);
      --shadow-hover: rgba(0,0,0,0.6);
      --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: var(--gradient-1);
      padding: 1.5rem 5%;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px var(--shadow);
      border-radius: 0 0 16px 16px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    h1 {
      font-size: 2rem;
      color: white;
      margin-bottom: 0.5rem;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      line-height: 1.2;
    }

    .subtitle {
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .stats-bar {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-light);
      font-size: 0.85rem;
    }

    .stat-item i {
      color: var(--primary);
    }

    nav.tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin: 1.8rem 0 1.5rem;
      padding: 1.2rem;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    nav.tabs button {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-light);
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }

    nav.tabs button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }

    nav.tabs button:hover::before {
      left: 100%;
    }

    nav.tabs button:hover {
      background: var(--card);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--shadow);
      color: var(--text);
    }

    nav.tabs button.active {
      background: var(--gradient-1);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      transform: scale(1.05);
    }

    .search-container {
      margin: 2rem 0 2.5rem;
      position: relative;
      max-width: 700px;
    }

    .search-bar {
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 1.2rem 1.5rem 1.2rem 4rem;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }

    .search-bar input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      background: var(--bg-secondary);
    }

    .search-bar i {
      position: absolute;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.1rem;
    }

    .filter-tags {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .filter-tag {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-light);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
    }

    .filter-tag:hover, .filter-tag.active {
      background: var(--gradient-1);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      backdrop-filter: blur(10px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-2);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 25px 50px var(--shadow-hover);
      border-color: var(--primary);
      background: var(--card-hover);
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: linear-gradient(135deg, #0a0a14, #141422);
      padding: 1.5rem;
      position: relative;
    }

    .card-img::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.3));
      pointer-events: none;
    }

    .card-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(233,30,99,0.9);
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .card-body {
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-subtitle {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-subtitle i {
      color: var(--primary);
      font-size: 0.8rem;
    }

    .card-details {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .detail-label {
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .detail-value {
      color: var(--text);
      font-weight: 500;
    }

    .price-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .price-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--gradient-2);
      color: white;
      padding: 0.8rem 1.4rem;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 0.5rem;
      box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3);
    }

    .price-tag:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
    }

    .price-tag i {
      font-size: 0.8rem;
    }

    .buy-tag {
      background: linear-gradient(135deg, rgba(76,175,80,0.15), rgba(76,175,80,0.25));
      color: #81c784;
      border-color: rgba(76,175,80,0.3);
    }

    .buy-tag:hover {
      background: linear-gradient(135deg, rgba(76,175,80,0.25), rgba(76,175,80,0.35));
    }

    .sell-tag {
      background: linear-gradient(135deg, rgba(255,152,0,0.15), rgba(255,152,0,0.25));
      color: #ffb74d;
      border-color: rgba(255,152,0,0.3);
    }

    .sell-tag:hover {
      background: linear-gradient(135deg, rgba(255,152,0,0.25), rgba(255,152,0,0.35));
    }

    .info-tags {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .info-tag {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 12px;
      backdrop-filter: blur(5px);
    }

    .info-tag:hover {
      background: var(--card);
      transform: translateY(-1px);
      border-color: var(--primary);
      color: var(--text);
    }

    .info-tag i {
      font-size: 0.9rem;
      color: var(--primary);
    }

    .cost-tag {
      background: linear-gradient(135deg, rgba(156,39,176,0.15), rgba(156,39,176,0.25));
      color: #ba68c8;
      border-color: rgba(156,39,176,0.3);
    }

    .cost-tag:hover {
      background: linear-gradient(135deg, rgba(156,39,176,0.25), rgba(156,39,176,0.35));
    }

    .profit-text {
      font-size: 0.8rem;
      color: #4caf50;
      font-weight: 500;
      margin-left: 0.3rem;
      opacity: 0.9;
    }

    .price-tag:hover .profit-text {
      opacity: 1;
    }

    .location-tags {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .location-tag {
      background: rgba(33,150,243,0.15);
      color: #64b5f6;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      border: 1px solid rgba(33,150,243,0.3);
    }

    .empty-state {
      text-align: center;
      padding: 6rem 1rem;
      color: var(--text-dim);
      font-size: 1.3rem;
    }

    .empty-state i {
      font-size: 4rem;
      color: var(--border);
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      color: var(--text-dim);
      border-top: 2px solid var(--border);
      margin-top: 4rem;
    }

    .donate-section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .donate-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .donate-images {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .donate-image {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid var(--border);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .donate-image:hover {
      transform: scale(1.05);
      border-color: var(--primary);
      box-shadow: 0 8px 25px var(--shadow);
    }

    .donate-note {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: 0.5rem;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 1024px) {
      .container {
        padding: 0 1.2rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .subtitle {
        font-size: 0.95rem;
      }
      
      nav.tabs {
        gap: 0.6rem;
        padding: 1rem;
      }
      
      nav.tabs button {
        padding: 0.7rem 1.2rem;
        font-size: 0.85rem;
        min-width: 100px;
      }
      
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.2rem;
      }
    }
    @media (max-width: 768px) {
      header {
        padding: 1.2rem 4%;
        border-radius: 0 0 12px 12px;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .subtitle {
        font-size: 0.9rem;
      }
      
      .stats-bar {
        gap: 1rem;
      }
      
      .stat-item {
        font-size: 0.8rem;
      }
      
      nav.tabs {
        justify-content: center;
        padding: 0.8rem;
        gap: 0.5rem;
        margin: 1.5rem 0 1.2rem;
      }
      
      nav.tabs button {
        padding: 0.6rem 1rem;
        font-size: 0.8rem;
        min-width: 90px;
      }
      
      .search-container {
        max-width: 100%;
        margin: 1.5rem 0 1.8rem;
      }
      
      .search-bar input {
        padding: 0.8rem 1rem 0.8rem 3rem;
        font-size: 0.85rem;
      }
      
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
      }
      
      .card {
        border-radius: 12px;
      }
      
      .card:hover {
        transform: translateY(-6px) scale(1.01);
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 1rem 3%;
      }
      
      .container {
        padding: 0 0.8rem;
      }
      
      h1 {
        font-size: 1.4rem;
        line-height: 1.1;
      }
      
      .subtitle {
        font-size: 0.85rem;
      }
      
      .stats-bar {
        gap: 0.8rem;
        justify-content: center;
      }
      
      .stat-item {
        font-size: 0.75rem;
      }
      
      nav.tabs {
        flex-direction: column;
        align-items: stretch;
        padding: 0.6rem;
        gap: 0.4rem;
        margin: 1.2rem 0 1rem;
      }
      
      nav.tabs button {
        text-align: center;
        padding: 0.8rem;
        font-size: 0.85rem;
        min-width: auto;
      }
      
      .search-container {
        margin: 1rem 0 1.5rem;
      }
      
      .search-bar input {
        padding: 0.7rem 0.8rem 0.7rem 2.5rem;
        font-size: 0.8rem;
      }
      
      .grid {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      
      .price-tag {
        font-size: 0.9rem;
        padding: 0.5rem 0.8rem;
      }
      
      .info-tag {
        font-size: 0.75rem;
        padding: 0.5rem 0.7rem;
      }
      
      .card-img {
        height: 140px;
      }
      
      .donate-section {
        margin-bottom: 1.5rem;
        padding: 1rem;
        background: var(--card);
        border-radius: 12px;
        border: 1px solid var(--border);
        max-width: 100%;
      }
      
      .donate-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.8rem;
      }
      
      .donate-images {
        gap: 0.8rem;
        margin-bottom: 0.8rem;
      }
      
      .donate-image {
        width: 80px;
        height: 80px;
        border-radius: 6px;
      }
      
      .donate-note {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <h1><i class="fas fa-heart"></i> Heartopia Guide By Van</h1>
    <div class="subtitle">Database lengkap ingredients, makanan, ikan, burung, serangga & lainnya</div>
    <div class="stats-bar" id="statsBar">
      <div class="stat-item"><i class="fas fa-database"></i> <span id="totalItems">0 items</span></div>
      <div class="stat-item"><i class="fas fa-layer-group"></i> <span id="totalCategories">6 categories</span></div>
      <div class="stat-item"><i class="fas fa-clock"></i> <span id="lastUpdated">Updated: 2026</span></div>
    </div>
  </div>
</header>

<div class="container">

  <nav class="tabs">
    <button class="active" data-tab="foods"><i class="fas fa-utensils"></i> Makanan</button>
    <button data-tab="ingredients"><i class="fas fa-carrot"></i> Bahan</button>
    <button data-tab="seeds"><i class="fas fa-seedling"></i> Benih</button>
    <button data-tab="insects"><i class="fas fa-bug"></i> Serangga</button>
    <button data-tab="birds"><i class="fas fa-dove"></i> Burung</button>
    <button data-tab="fish"><i class="fas fa-fish"></i> Ikan</button>
  </nav>

  <div class="search-container">
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Cari nama makanan, bahan, ikan, burung..." autocomplete="off">
    </div>
    <div class="filter-tags" id="filterTags">
      <!-- Filter tags will be generated dynamically -->
    </div>
  </div>

  <div id="contentArea" class="grid">
    <!-- Cards will be generated by JavaScript -->
  </div>

</div>

<footer>
  <div class="donate-section">
    <div class="donate-title">
      <i class="fas fa-heart"></i>
      Support Heartopia Guide
    </div>
    <div class="donate-images">
      <img src="https://github.com/user-attachments/assets/da15534c-cf77-4fb9-991e-932c470b1d06" alt="Donate QR Code 1" class="donate-image" onclick="window.open('https://github.com/user-attachments/assets/da15534c-cf77-4fb9-991e-932c470b1d06', '_blank')">
      <img src="https://github.com/user-attachments/assets/da15534c-cf77-4fb9-991e-932c470b1d06" alt="Donate QR Code 2" class="donate-image" onclick="window.open('https://github.com/user-attachments/assets/da15534c-cf77-4fb9-991e-932c470b1d06', '_blank')">
    </div>
    <div class="donate-note">
      Klik gambar untuk memperbesar • Terima kasih atas dukungan Anda!
    </div>
  </div>
  
  <p><i class="fas fa-code"></i> Data diambil dari heartopia data • Dibuat untuk komunitas Heartopia •</p>
</footer>

<script>
// ================================================
// Data Storage
// ================================================
let DATA = {
  ingredients: [],
  foods: [],
  seeds: [],
  insects: [],
  birds: [],
  fish: []
};

// ================================================
// Load Data from Supabase
// ================================================
async function loadData() {
  try {
    console.log('Loading data from Supabase...');
    document.getElementById('contentArea').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading data from database...</div>';
    
    // Initialize Supabase client
    const supabaseUrl = 'https://ogcxugdalqehvwxhzrct.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nY3h1Z2RhbHFlaHZ3eGh6cmN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjA0NzAsImV4cCI6MjA4ODk5NjQ3MH0.BEsPMld6a9WzGM71Z5y1AbPdr4P6p1v0Pqr03DTAEZk';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
    
    // Load all data from Supabase tables
    const [ingredientsData, foodsData, seedsData, insectsData, birdsData, fishData] = await Promise.all([
      supabase.from('ingredients').select('*'),
      supabase.from('foods').select('*'),
      supabase.from('seeds').select('*'),
      supabase.from('insects').select('*'),
      supabase.from('birds').select('*'),
      supabase.from('fish').select('*')
    ]);
    
    // Check for errors
    const errors = [
      ingredientsData.error, foodsData.error, seedsData.error,
      insectsData.error, birdsData.error, fishData.error
    ].filter(error => error);
    
    if (errors.length > 0) {
      console.error('Supabase errors:', errors);
      throw new Error('Database error: ' + errors.map(e => e.message).join(', '));
    }
    
    DATA = {
      ingredients: ingredientsData.data || [],
      foods: foodsData.data || [],
      seeds: seedsData.data || [],
      insects: insectsData.data || [],
      birds: birdsData.data || [],
      fish: fishData.data || []
    };
    
    console.log('Data loaded from Supabase:', DATA);
    updateStats();
    renderTab(currentTab);
    generateFilterTags();
    
  } catch (error) {
    console.error('Error loading data from Supabase:', error);
    // Fallback to local JSON if Supabase fails
    try {
      console.log('Falling back to local JSON...');
      const response = await fetch('./heartopia-data-2026-03-13.json');
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const localData = await response.json();
      
      DATA = {
        ingredients: localData.ingredients || [],
        foods: localData.foods || [],
        seeds: localData.seeds || [],
        insects: localData.insects || [],
        birds: localData.birds || [],
        fish: localData.fish || []
      };
      
      console.log('Data loaded from local fallback:', DATA);
      updateStats();
      renderTab(currentTab);
      generateFilterTags();
      
    } catch (fallbackError) {
      console.error('Fallback also failed:', fallbackError);
      document.getElementById('contentArea').innerHTML = 
        '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error loading data. Please check your connection and refresh the page.</div>';
    }
  }
}

// ================================================
// Update Statistics
// ================================================
function updateStats() {
  const totalItems = Object.values(DATA).reduce((sum, items) => sum + items.length, 0);
  document.getElementById('totalItems').textContent = `${totalItems} items`;
}

// ================================================
// Generate Filter Tags
// ================================================
function generateFilterTags() {
  const filterTags = document.getElementById('filterTags');
  const currentItems = DATA[currentTab] || [];
  
  let filterHTML = '';
  
  // Generate level filters for categories that have hobby levels
  if (['ingredients', 'foods', 'seeds', 'insects', 'birds'].includes(currentTab)) {
    const uniqueLevels = [...new Set(currentItems.map(item => item.hobby_level).filter(Boolean))];
    
    if (uniqueLevels.length > 0) {
      filterHTML += uniqueLevels.map(level => 
        `<span class="filter-tag" data-level="${level}">Level ${level}</span>`
      ).join('');
    }
  }
  
  // Generate weather filters for fish only
  if (['fish'].includes(currentTab)) {
    const uniqueWeather = [...new Set(currentItems.flatMap(item => item.weather || []))];
    
    if (uniqueWeather.length > 0) {
      filterHTML += uniqueWeather.map(weather => 
        `<span class="filter-tag" data-weather="${weather}">${weather}</span>`
      ).join('');
    }
  }
  
  filterTags.innerHTML = filterHTML;
  
  // Add event listeners to filter tags
  filterTags.querySelectorAll('.filter-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      tag.classList.toggle('active');
      applyFilters();
    });
  });
}

// ================================================
// Filter & Render
// ================================================
const contentArea = document.getElementById('contentArea');
const searchInput = document.getElementById('searchInput');
let currentTab = 'foods';

function applyFilters() {
  const searchTerm = searchInput.value.toLowerCase().trim();
  const activeFilters = Array.from(document.querySelectorAll('.filter-tag.active'));
  const activeLevelFilters = activeFilters.map(tag => tag.dataset.level).filter(Boolean);
  const activeWeatherFilters = activeFilters.map(tag => tag.dataset.weather).filter(Boolean);
  
  let items = DATA[currentTab] || [];
  
  // Apply search filter
  if (searchTerm) {
    items = items.filter(item => item.name.toLowerCase().includes(searchTerm));
  }
  
  // Apply level filters
  if (activeLevelFilters.length > 0) {
    items = items.filter(item => 
      activeLevelFilters.includes(String(item.hobby_level))
    );
  }
  
  // Apply weather filters
  if (activeWeatherFilters.length > 0) {
    items = items.filter(item => {
      if (!item.weather || item.weather.length === 0) return false;
      return activeWeatherFilters.some(filter => item.weather.includes(filter));
    });
  }
  
  // Sort items by hobby level (smallest to largest) for categories that have levels
  if (['ingredients', 'foods', 'seeds', 'insects', 'birds'].includes(currentTab)) {
    items.sort((a, b) => {
      const aLevel = a.hobby_level || 0;
      const bLevel = b.hobby_level || 0;
      return aLevel - bLevel;
    });
  }
  
  renderItems(items);
}

function renderItems(items) {
  if (items.length === 0) {
    contentArea.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i> Tidak ditemukan hasil untuk pencarian ini</div>';
    return;
  }
  
  const html = items.map(item => renderCard(item, currentTab)).join('');
  contentArea.innerHTML = html;
}

function renderTab(tab) {
  currentTab = tab;
  generateFilterTags(); // Regenerate filters for new tab
  applyFilters(); // Apply current filters
}

// ================================================
// Event Listeners
// ================================================
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.tabs .active')?.classList.remove('active');
    btn.classList.add('active');
    renderTab(btn.dataset.tab);
  });
});

searchInput.addEventListener('input', applyFilters);

// ================================================
// Initialize
// ================================================
document.addEventListener('DOMContentLoaded', () => {
  loadData();
});
